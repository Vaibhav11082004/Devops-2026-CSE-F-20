name: SentinelAI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Run Backend Automated Tests
        working-directory: ./backend
        run: npm test

      - name: 🔨 Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

      - name: 🔨 Build Frontend Production Bundle
        run: npm run build

      - name: 🐳 Validate Dockerfile Builds
        run: |
          docker build -t sentinel-backend:test ./backend
          docker build -t sentinel-frontend:test .
