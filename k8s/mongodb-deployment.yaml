apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-mongodb
  namespace: sentinel-system
  labels:
    app: sentinel-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-mongodb
  template:
    metadata:
      labels:
        app: sentinel-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-mongodb
  namespace: sentinel-system
spec:
  selector:
    app: sentinel-mongodb
  ports:
    - port: 27017
      targetPort: 27017
