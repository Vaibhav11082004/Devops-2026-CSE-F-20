# =========================================================================
# Render Blueprint Specification for SentinelAI Full-Stack Platform
# Docs: https://render.com/docs/blueprint-spec
# =========================================================================

services:
  # -----------------------------------------------------------------------
  # 1. Backend Web Service (Node.js Express + SQLite + WebSockets + Metrics)
  # -----------------------------------------------------------------------
  - type: web
    name: sentinel-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: '*'

  # -----------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite + Tailwind CSS + SPA Router)
  # -----------------------------------------------------------------------
  - type: web
    name: sentinel-frontend
    runtime: static
    rootDir: .
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sentinel-backend
          envVarKey: RENDER_EXTERNAL_URL
