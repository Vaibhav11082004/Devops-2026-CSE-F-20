services:
  # =========================================================================
  # Frontend: React 19 + Tailwind CSS + Nginx Alpine
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentinel-net

  # =========================================================================
  # Backend: Express + TypeScript + WebSockets + Prometheus Metrics
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=sentinel_super_secret_jwt_key_2026_defense_grid
      - JWT_EXPIRES_IN=7d
      - CLIENT_ORIGIN=http://localhost
      - MONGODB_URI=mongodb://mongodb:27017/sentinel
    depends_on:
      - mongodb
    networks:
      - sentinel-net

  # =========================================================================
  # Database: MongoDB NoSQL Store
  # =========================================================================
  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - sentinel-net

  # =========================================================================
  # Monitoring: Prometheus Time-Series Metrics Server
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sentinel-net

  # =========================================================================
  # Visualization: Grafana Real-Time Observability Dashboards
  # =========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=sentinel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  mongo-data:
  grafana-data:
